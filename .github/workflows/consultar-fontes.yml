name: Consultar fontes de folhetos
on:
  workflow_dispatch:
  push:
    branches: [fix/coletor-precos]
    paths: [tools/coletor_precos.py]
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/coletor_precos.py --output atualizacoes --verificar-precos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consulta-fontes
          path: atualizacoes/
          retention-days: 3
