name: Consultar fontes de folhetos
on:
  workflow_dispatch:
  push:
    branches: [fix/coletor-precos]
    paths: [tools/coletor_precos.py]
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/coletor_precos.py --output atualizacoes
      - name: Inspecionar capa pública para revisão
        if: github.ref == 'refs/heads/fix/coletor-precos'
        run: |
          python - <<'PY'
          import base64,json
          from urllib.request import Request,urlopen
          data=json.load(open('atualizacoes/consulta.json'))
          for source in data['sources'][:2]:
              for preview in source.get('previews',[])[:1]:
                  for url in preview.get('images',[])[:1]:
                      if not url.startswith('https://d160aj0mj3npgx.cloudfront.net/'):continue
                      with urlopen(Request(url,headers={'User-Agent':'PrecoMobi-Coletor/1.0'}),timeout=20) as response:
                          raw=response.read(500001)
                          if len(raw)>500000:raise ValueError('Imagem muito grande')
                          print('PUBLIC_COVER_BASE64='+base64.b64encode(raw).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consulta-fontes
          path: atualizacoes/
          retention-days: 3
